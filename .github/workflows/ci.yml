name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json's "packageManager" field.
      # Don't also set `version` here — the action errors with
      # ERR_PNPM_BAD_PM_VERSION when both are specified.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: bun test

      - name: Coverage report
        run: bun test --coverage 2>&1 | tee coverage.txt
        # Output lands in the job log and is uploaded as an artifact, so PR
        # review can see the delta without Codecov/Coveralls credentials.

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt
