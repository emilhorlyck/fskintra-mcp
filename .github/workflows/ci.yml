name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # `--frozen-lockfile` is the whole point of committing bun.lock: CI fails
      # on a lockfile that doesn't match package.json rather than quietly
      # resolving something else.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Coverage report
        run: bun test --coverage 2>&1 | tee coverage.txt
        # Output lands in the job log and is uploaded as an artifact, so PR
        # review can see the delta without Codecov/Coveralls credentials.

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt
