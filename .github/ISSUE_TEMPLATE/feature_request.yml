name: Feature request
description: Suggest something fskintra-mcp should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is about reading data, not writing it back to ForældreIntra.
