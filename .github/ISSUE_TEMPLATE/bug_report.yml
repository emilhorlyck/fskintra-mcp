name: Bug report
description: Something in fskintra-mcp does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please run `fskintra doctor --debug`. It reports which
        sections parsed, which your school does not have, and which are broken —
        and it writes a **sanitised** wire transcript you can attach.
  - type: textarea
    id: doctor
    attributes:
      label: Output of `fskintra doctor`
      render: text
    validations:
      required: true
  - type: input
    id: school
    attributes:
      label: School host
      description: e.g. minskole.skoleintra.dk. Leave blank if you'd rather not say.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: transcript
    attributes:
      label: Wire transcript (optional)
      description: >-
        From `fskintra transcript list` / `view`. Secrets are redacted when the
        transcript is written — cookies, passwords, anti-forgery tokens. Please
        skim it anyway before pasting.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `bun --version` and the fskintra-mcp version or commit.
